<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Neel Tarang – Restaurant Ordering & Billing</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
    <style>
         :root {
            --ink: #0a3540;
            --deep: #0a4d68;
            --blue: #088395;
            --light: #05bfdb;
            --sky: #d8f6fa;
            --mist: #eafafd;
            --line: #b7e5ed;
            --muted: #527078;
            --green: #0f9d6b;
            --ok: #0f9d6b;
            --warn: #e08a00;
            --bad: #d64545;
            --r: 14px
        }
        
        * {
            box-sizing: border-box;
            margin: 0
        }
        
        body {
            font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
            background: var(--mist);
            color: var(--ink);
            min-height: 100vh
        }
        
        h1,
        h2,
        h3 {
            font-family: Georgia, "Times New Roman", serif;
            letter-spacing: .2px
        }
        
        button,
        input,
        select {
            font: inherit
        }
        
        header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: linear-gradient(100deg, var(--deep), var(--blue));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            box-shadow: 0 4px 18px rgba(10, 77, 104, .3)
        }
        
        header b {
            font-family: Georgia, serif;
            font-size: 1.25rem
        }
        
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 99px;
            margin-left: 6px;
            font-size: .92rem
        }
        
        nav a.on,
        nav a:hover {
            background: rgba(255, 255, 255, .2)
        }
        
        main {
            max-width: 1100px;
            margin: auto;
            padding: 18px
        }
        
        .hero {
            background:
                linear-gradient(120deg, rgba(10, 53, 64, .88), rgba(8, 131, 149, .76) 70%, rgba(5, 191, 219, .62)),
                url("https://i.pinimg.com/736x/8e/70/ef/8e70ef02743bdee9634d2b19cc9c04df.jpg") center 43% / cover no-repeat;
            color: #fff;
            border-radius: 22px;
            padding: 30px 26px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            animation: customer-enter .5s ease-out both
        }
        
        .hero:after {
            content: "🍛";
            position: absolute;
            right: 20px;
            bottom: -14px;
            font-size: 110px;
            opacity: .25;
            animation: food-float 5s ease-in-out infinite
        }
        
        .hero h1 {
            font-size: 2rem;
            margin-bottom: 6px
        }

        .hero p {
            max-width: 720px;
            font-family: "Brush Script MT", "Segoe Script", "Lucida Handwriting", cursive;
            font-size: clamp(1.2rem, 3vw, 1.65rem);
            line-height: 1.45;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .35)
        }
        
        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 14px 0
        }
        
        .chip {
            border: 1.5px solid var(--line);
            background: #fff;
            color: var(--deep);
            padding: 7px 16px;
            border-radius: 99px;
            cursor: pointer;
            transition: transform .18s ease, background .18s ease, color .18s ease, border-color .18s ease
        }
        
        .chip.on,
        .chip:hover {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
            transform: translateY(-2px)
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 14px
        }
        
        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 16px;
            transition: .18s
        }
        
        .item:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 10px 24px rgba(8, 131, 149, .18)
        }

        .item {
            animation: customer-enter .45s ease-out backwards
        }

        .item:nth-child(2) { animation-delay: 45ms }
        .item:nth-child(3) { animation-delay: 90ms }
        .item:nth-child(4) { animation-delay: 135ms }
        .item:nth-child(5) { animation-delay: 180ms }
        .item:nth-child(6) { animation-delay: 225ms }
        .item:nth-child(7) { animation-delay: 270ms }
        .item:nth-child(8) { animation-delay: 315ms }
        .item:nth-child(n+9) { animation-delay: 360ms }

        .tracking .card {
            animation: customer-enter .4s ease-out backwards
        }

        @keyframes customer-enter {
            from {
                opacity: 0;
                transform: translateY(14px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes food-float {
            0%, 100% { transform: translateY(0) rotate(-4deg) }
            50% { transform: translateY(-8px) rotate(3deg) }
        }
        
        .item .em {
            font-size: 40px
        }

        .food-photo {
            display: block;
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 10px;
            background: var(--sky)
        }

        .food-rating {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 5px 8px;
            margin-top: 9px;
            color: var(--muted);
            font-size: .82rem;
        }

        .food-rating-summary {
            color: #f2b94b;
            font-weight: 700;
        }

        .food-rating-stars {
            display: inline-flex;
            align-items: center;
            gap: 1px;
        }

        .food-rating-star {
            min-width: 27px;
            min-height: 30px;
            border: 0;
            border-radius: 5px;
            padding: 1px 3px;
            background: transparent;
            color: #9aabb0;
            cursor: pointer;
            font: inherit;
            font-size: 1.15rem;
            line-height: 1;
        }

        .food-rating-star:hover,
        .food-rating-star:focus-visible,
        .food-rating-star.is-selected {
            color: #ffc857;
        }

        .food-rating-star:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 1px;
        }

        .food-rating-feedback {
            flex-basis: 100%;
            min-height: 1em;
            color: var(--green);
            font-size: .75rem;
        }

        .suggestion-card .food-rating {
            gap: 2px 5px;
            margin-top: 4px;
            font-size: .74rem;
        }

        .suggestion-card .food-rating-star {
            min-width: 22px;
            min-height: 25px;
            font-size: 1rem;
        }

        .suggestion-card .food-rating-feedback {
            font-size: .7rem;
        }

        .tracking {
            margin: 18px 0
        }

        .suggestions {
            margin: 18px 0
        }

        .suggestion-card {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .suggestion-photo {
            width: 72px;
            height: 64px;
            flex: 0 0 72px;
            object-fit: cover;
            border-radius: 9px;
            background: var(--sky)
        }

        .order-number {
            color: var(--deep);
            font-size: 1.15rem;
            font-weight: 700
        }

        .kitchen-status {
            color: var(--ok);
            font-weight: 700
        }
        
        .item h3 {
            font-size: 1.05rem;
            margin: 6px 0 2px
        }
        
        .muted {
            color: #5b7391;
            font-size: .85rem
        }
        
        .price {
            font-weight: 700;
            color: var(--deep);
            font-size: 1.1rem
        }
        
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px
        }
        
        .btn {
            border: 0;
            background: var(--blue);
            color: #fff;
            padding: 9px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: .15s
        }
        
        .btn:hover {
            background: var(--deep)
        }
        
        .btn.ghost {
            background: var(--sky);
            color: var(--deep)
        }
        
        .btn.ok {
            background: var(--ok)
        }
        
        .btn.bad {
            background: var(--bad)
        }
        
        .btn.sm {
            padding: 5px 10px;
            font-size: .85rem
        }
        
        .qty {
            display: flex;
            align-items: center;
            gap: 10px
        }
        
        .qty button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 0;
            background: var(--sky);
            color: var(--deep);
            font-size: 1.1rem;
            cursor: pointer
        }
        
        .qty button:hover {
            background: var(--blue);
            color: #fff
        }
        
        .fab {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 15;
            box-shadow: 0 8px 24px rgba(10, 77, 104, .4);
            padding: 14px 22px;
            border-radius: 99px;
            font-size: 1rem
        }

        .chat-launcher {
            position: fixed;
            left: 18px;
            bottom: 18px;
            z-index: 30;
            border: 0;
            border-radius: 99px;
            padding: 13px 18px;
            background: var(--deep);
            color: #fff;
            box-shadow: 0 8px 24px rgba(10, 77, 104, .35);
            cursor: pointer
        }

        .chat-panel {
            position: fixed;
            left: 18px;
            bottom: 78px;
            z-index: 30;
            display: none;
            flex-direction: column;
            width: min(370px, calc(100vw - 36px));
            height: min(510px, calc(100vh - 115px));
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 12px 36px rgba(10, 53, 64, .25)
        }

        .chat-panel.open {
            display: flex;
            animation: pop .2s ease-out
        }

        .chat-header {
            padding: 14px 16px;
            background: linear-gradient(100deg, var(--deep), var(--blue));
            color: #fff
        }

        .chat-log {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding: 14px
        }

        .chat-message {
            max-width: 90%;
            padding: 10px 12px;
            border-radius: 14px;
            background: var(--sky);
            line-height: 1.4;
            overflow-wrap: anywhere
        }

        .chat-message.user {
            align-self: flex-end;
            background: var(--blue);
            color: #fff
        }

        .chat-picks {
            display: grid;
            gap: 7px;
            margin-top: 8px
        }

        .chat-pick {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            color: var(--ink)
        }

        .chat-form {
            display: flex;
            gap: 7px;
            padding: 10px;
            border-top: 1px solid var(--line)
        }

        .chat-form input {
            min-width: 0
        }

        .chat-form .btn {
            flex: 0 0 auto
        }

        .chat-voice {
            margin: 0 10px 10px
        }

        .prize-wheel-wrap {
            position: relative;
            width: min(270px, 72vw);
            aspect-ratio: 1;
            margin: 22px auto
        }

        .prize-wheel {
            position: absolute;
            inset: 0;
            border: 6px solid #fff;
            border-radius: 50%;
            background: conic-gradient(var(--blue) 0deg 90deg, #f39838 90deg 180deg, var(--light) 180deg 270deg, #efb33d 270deg 360deg);
            box-shadow: 0 4px 18px rgba(10, 77, 104, .25);
            transform: rotate(0deg);
            transition: transform 4.2s cubic-bezier(.12, .72, .12, 1)
        }

        .prize-wheel.spinning {
            transform: rotate(var(--wheel-end-angle))
        }

        .wheel-pointer {
            position: absolute;
            z-index: 2;
            top: -5px;
            left: 50%;
            width: 0;
            height: 0;
            border-right: 13px solid transparent;
            border-left: 13px solid transparent;
            border-top: 24px solid var(--deep);
            transform: translateX(-50%)
        }

        .wheel-label {
            position: absolute;
            z-index: 1;
            width: 90px;
            color: #fff;
            font-size: .82rem;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .35)
        }

        .wheel-label.one { top: 21%; left: 53%; transform: rotate(45deg) }
        .wheel-label.two { top: 54%; left: 53%; transform: rotate(135deg) }
        .wheel-label.three { top: 54%; right: 53%; transform: rotate(225deg) }
        .wheel-label.four { top: 21%; right: 53%; transform: rotate(315deg) }

        .wheel-center {
            position: absolute;
            z-index: 3;
            top: 50%;
            left: 50%;
            display: grid;
            width: 58px;
            height: 58px;
            place-items: center;
            border: 4px solid #fff;
            border-radius: 50%;
            background: var(--deep);
            color: #fff;
            font-size: .72rem;
            font-weight: 700;
            transform: translate(-50%, -50%)
        }
        
        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            background: #fff;
            color: var(--ink)
        }
        
        input:focus,
        select:focus,
        button:focus-visible,
        a:focus-visible {
            outline: 3px solid var(--light);
            outline-offset: 1px
        }
        
        label {
            display: block;
            font-size: .85rem;
            margin: 10px 0 4px;
            color: #3b587a
        }
        
        #modal {
            position: fixed;
            inset: 0;
            background: rgba(10, 37, 64, .55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 14px
        }
        
        #modal.show {
            display: flex
        }
        
        .box {
            background: #fff;
            border-radius: 18px;
            padding: 22px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow: auto;
            animation: pop .2s
        }
        
        @keyframes pop {
            from {
                transform: scale(.95);
                opacity: 0
            }
            to {
                transform: none;
                opacity: 1
            }
        }
        
        #toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            background: var(--ink);
            color: #fff;
            padding: 11px 20px;
            border-radius: 99px;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            z-index: 60
        }
        
        #toast.show {
            opacity: 1
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 16px
        }
        
        .stat b {
            display: block;
            font-size: 1.5rem;
            color: var(--deep);
            font-family: Georgia, serif
        }
        
        .tag {
            padding: 3px 10px;
            border-radius: 99px;
            font-size: .78rem;
            font-weight: 700
        }
        
        .tag.new {
            background: #fff1d6;
            color: var(--warn)
        }
        
        .tag.paid {
            background: #d8f5ea;
            color: var(--ok)
        }

        .tag.stage-pending {
            background: #e6f0ff;
            color: var(--deep)
        }

        .tag.stage-cooking {
            background: #fff1d6;
            color: #9a5c00
        }

        .tag.stage-ready {
            background: #d8f5ea;
            color: var(--ok)
        }

        .tag.stage-served {
            background: #edf0f2;
            color: #52616b
        }
        
        .bar {
            height: 10px;
            border-radius: 9px;
            background: linear-gradient(90deg, var(--blue), var(--light));
            margin-top: 4px
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .92rem
        }
        
        td,
        th {
            padding: 7px 4px;
            text-align: left
        }
        
        th {
            color: #5b7391;
            font-weight: 600;
            border-bottom: 1px solid var(--line)
        }
        
        td.r,
        th.r {
            text-align: right
        }
        
        .bill {
            font-family: "Courier New", monospace;
            font-size: .88rem
        }
        
        .bill hr {
            border: 0;
            border-top: 1px dashed #789;
            margin: 8px 0
        }
        
        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #5b7391
        }
        
        @media print {
            body * {
                visibility: hidden
            }
            #bill,
            #bill * {
                visibility: visible
            }
            #bill {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%
            }
        }
        
        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none!important;
                transition: none!important
            }
        }
        
        @media(max-width:560px) {
            .hero h1 {
                font-size: 1.5rem
            }
            header {
                flex-direction: column;
                gap: 8px
            }
        }
    </style>

</head>

<body class="ordering-page">
    <canvas id="ambient-background" aria-hidden="true"></canvas>
    <header><b>🍽️ Neel Tarang</b>
        <nav id="nav"><a href="index.html" id="n1">Welcome</a><a href="login.html" id="n2">Owner login</a></nav>
    </header>
    <main id="app"></main>
    <div id="modal"></div>
    <div id="toast"></div>

    <script src="config.js"></script>
    <script src="api-client.js"></script>
    <script src="background.js" defer></script>
    <script src="mascot.js" defer></script>
    <script src="auth.js"></script>
    <script>
        const $ = s => document.querySelector(s);
        const esc = t => String(t).replace(/[&<>"']/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[c]));
        const inr = n => '₹' + Number(n).toLocaleString('en-IN', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
        const load = (k, d) => {
            try {
                return JSON.parse(localStorage.getItem(k)) ?? d
            } catch (e) {
                return d
            }
        };
        const save = (k, v) => {
            try {
                localStorage.setItem(k, JSON.stringify(v))
            } catch (e) {
                toast('Storage full or blocked')
            }
        };
        function foodRating(id) {
            const ratings = load('rb_food_ratings', {});
            const saved = ratings && ratings[String(id)] || {};
            const count = Math.max(0, Number(saved.count) || 0);
            const sum = Math.max(0, Number(saved.sum) || 0);
            const myRatings = load('rb_my_ratings', {});
            const myRating = Number(myRatings && myRatings[String(id)]);
            return {
                count,
                average: count ? sum / count : 0,
                myRating: Number.isInteger(myRating) && myRating >= 1 && myRating <= 5 ? myRating : 0
            };
        }
        function foodRatingControl(item) {
            const rating = foodRating(item.id);
            const label = `${item.n} rating`;
            const summary = rating.count
                ? `★ ${rating.average.toFixed(1)} · ${rating.count} rating${rating.count === 1 ? '' : 's'}`
                : 'No ratings yet';
            return `<div class="food-rating" role="group" aria-label="${esc(label)}">
                <span class="food-rating-summary">${summary}</span>
                <span class="food-rating-stars">${[1, 2, 3, 4, 5].map(star => `<button type="button" class="food-rating-star ${star <= rating.myRating ? 'is-selected' : ''}" data-food-rating="${esc(item.id)}" data-rating="${star}" aria-label="Rate ${esc(item.n)} ${star} out of 5 stars" aria-pressed="${rating.myRating === star}">${star <= rating.myRating ? '★' : '☆'}</button>`).join('')}</span>
                <span class="food-rating-feedback" data-rating-feedback="${esc(item.id)}" aria-live="polite"></span>
            </div>`;
        }
        async function rateFood(id, value) {
            const rating = Number(value);
            if (!Number.isInteger(rating) || rating < 1 || rating > 5) return;
            const key = String(id);
            const myRatings = load('rb_my_ratings', {});
            const previous = Number(myRatings[key]) || 0;
            try {
                // The server keeps the shared total; only this device remembers which stars you picked.
                const entry = await RBApi.request('POST', '/api/ratings', { itemId: id, rating, previous });
                const ratings = load('rb_food_ratings', {});
                ratings[key] = entry;
                RBApi.adopt('rb_food_ratings', ratings);
                myRatings[key] = rating;
                localStorage.setItem('rb_my_ratings', JSON.stringify(myRatings));
            } catch (error) {
                console.error('Could not save the food rating.', error);
                toast('Rating could not be saved. ' + (error.message || ''));
                return;
            }
            customer();
            const feedback = document.querySelector(`[data-rating-feedback="${CSS.escape(key)}"]`);
            if (feedback) feedback.textContent = `Your rating: ${rating} out of 5. Thank you!`;
        }
        const DEF = [{
            id: 1,
            n: 'Paneer Butter Masala',
            c: 'Main Course',
            p: 220,
            e: '🍛',
            img: 'https://images.unsplash.com/photo-1631452180519-c014fe946bc7?auto=format&fit=crop&w=800&q=85'
        }, {
            id: 2,
            n: 'Dal Makhani',
            c: 'Main Course',
            p: 180,
            e: '🥘',
            img: 'https://images.unsplash.com/photo-1546833999-b9f581a1996d?auto=format&fit=crop&w=800&q=85'
        }, {
            id: 3,
            n: 'Veg Biryani',
            c: 'Main Course',
            p: 200,
            e: '🍚',
            img: 'https://images.unsplash.com/photo-1589302168068-964664d93dc0?auto=format&fit=crop&w=800&q=85'
        }, {
            id: 4,
            n: 'Butter Naan',
            c: 'Breads',
            p: 45,
            e: '🫓',
            img: 'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=85'
        }, {

function chatRecommendations(query){
  const text=query.toLowerCase();
  const budgetPatterns=[/(?:under|below|less than|up to|upto|within|budget(?: of)?|₹|rs\.?|rupees|कम|तक|बजट)\s*(\d{1,5})/i,/(\d{1,5})\s*(?:rupees|rs\.?|₹|के अंदर|तक)/i];
  const budgetMatch=budgetPatterns.map(pattern=>text.match(pattern)).find(Boolean);
  const budget=budgetMatch?Number(budgetMatch[1]):null;
  const wantsSpicy=/spicy|spicier|hot|chilli|chili|तीखा|मसालेदार/i.test(text);
  const wantsVeg=/\bveg\b|vegetarian|vegan|शाकाहारी/i.test(text);
  const categoryWords=[
    {pattern:/starter|snack|appetizer|स्टार्टर|नाश्ता/i,category:'Starters'},
    {pattern:/bread|naan|roti|ब्रेड|नान|रोटी/i,category:'Breads'},
    {pattern:/dessert|sweet|mithai|मिठाई|मीठा/i,category:'Desserts'},
    {pattern:/drink|beverage|chai|tea|lassi|soda|पेय|चाय|लस्सी/i,category:'Drinks'},
    {pattern:/main course|curry|सब्ज़ी|सब्जी/i,category:'Main Course'},
    {pattern:/dosa|डोसा/i,category:'South Indian'}
  ];
  const wantedCategories=categoryWords.filter(entry=>entry.pattern.test(text)).map(entry=>entry.category);
  const items=menu.map(item=>{
    const name=item.n.toLowerCase();
    let score=0;
    if(wantsSpicy&&/masala|tikka|manchurian|tandoori|spicy|chilli|chili/i.test(name))score+=4;
    if(wantsVeg&&!/chicken|mutton|lamb|fish|prawn|egg|non.?veg/i.test(`${name} ${item.c}`))score+=2;
    if(wantedCategories.includes(item.c))score+=5;
    if(name.split(/\W+/).filter(word=>word.length>2&&text.includes(word)).length)score+=6;
    return {item,score};
  }).filter(entry=>!wantsVeg||!/chicken|mutton|lamb|fish|prawn|egg|non.?veg/i.test(`${entry.item.n} ${entry.item.c}`));
  const spicyItems=wantsSpicy?items.filter(entry=>/masala|tikka|manchurian|tandoori|spicy|chilli|chili/i.test(entry.item.n)):items;
  const intentItems=spicyItems.length?spicyItems:items;
  const affordable=budget===null?intentItems:intentItems.filter(entry=>Number(entry.item.p)<=budget);
  const ranked=(affordable.length?affordable:intentItems).sort((a,b)=>b.score-a.score||Number(a.item.p)-Number(b.item.p));
  return {items:ranked.slice(0,3).map(entry=>entry.item),budget,usedClosest:budget!==null&&!affordable.length,wantsSpicy,wantsVeg};
}

const voiceNumbers={
  'one':1,'a':1,'an':1,'ek':1,'एक':1,
  'two':2,'do':2,'दो':2,

function spokenQuantity(text,index){
  const words=text.slice(0,index).trim().split(/\s+/).filter(Boolean);
  const units=['plate','plates','piece','pieces','pc','pcs','glass','cup','कटोरी','प्लेट','गिलास'];
  let last=words[words.length-1];
  if(units.includes(last)&&words.length>1)last=words[words.length-2];
  const parsed=Number(last);
  return Number.isInteger(parsed)&&parsed>0?Math.min(parsed,20):(Object.prototype.hasOwnProperty.call(voiceNumbers,last)?voiceNumbers[last]:1);
}
function parseSpokenOrder(transcript){
  const text=transcript.toLowerCase().replace(/[.,!?;:]/g,' ').replace(/\s+/g,' ').trim();
  const requested=[];
  menu.forEach(item=>{
    const aliases=[...(voiceAliases[item.n.toLowerCase()]||[]),item.n.toLowerCase()]
      .map(alias=>alias.toLowerCase())
      .sort((a,b)=>b.length-a.length);
    const matches=aliases.map(alias=>({alias,index:text.indexOf(alias)}))
      .filter(match=>match.index>=0)
      .sort((a,b)=>a.index-b.index||b.alias.length-a.alias.length);
    if(matches.length){
      const match=matches[0];
      requested.push({item,quantity:spokenQuantity(text,match.index)});
    }
  });
  return requested;
}
function handleSpokenOrder(transcript){
  chatMessages.push({role:'user',text:`🎙️ ${transcript}`});
  const requested=parseSpokenOrder(transcript);
  if(!requested.length){
    chatMessages.push({role:'bot',text:'I could not match that to a menu item. Please say the dish name, for example: “do butter naan aur ek lassi”.'});
  }else{
    requested.forEach(({item,quantity})=>{cart[item.id]=(cart[item.id]||0)+quantity});
    chatMessages.push({role:'bot',text:`Added to your order: ${requested.map(({item,quantity})=>`${quantity} × ${item.n}`).join(', ')}.`});
  }
  chatVoiceStatus='';
  customer();
  const log=$('#chat-log');
  if(log)log.scrollTop=log.scrollHeight;
}
function startVoiceOrder(){
  chatOpen=true;
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    chatMessages.push({role:'bot',text:'Voice ordering is not supported by this browser. You can type your request instead.'});
    customer();
    return;
  }
  if(voiceRecognition)return;
  const recognition=new SpeechRecognition();
  recognition.lang='hi-IN';
  recognition.continuous=false;
  recognition.interimResults=false;
  voiceRecognition=recognition;
  chatVoiceStatus='Listening… Say a dish name and quantity.';
  customer();
  recognition.onresult=event=>{
    const transcript=event.results[0][0].transcript;
    handleSpokenOrder(transcript);
  };
  recognition.onerror=event=>{
    chatVoiceStatus='';
    chatMessages.push({role:'bot',text:event.error==='not-allowed'?'Microphone access was denied. Allow microphone access or type your request.':'Voice input could not be completed. Please try again or type your request.'});
    customer();
  };
  recognition.onend=()=>{
    voiceRecognition=null;
    if(chatVoiceStatus){chatVoiceStatus='';customer()}
  };
  try{
    recognition.start();
  }catch(error){
    voiceRecognition=null;
    chatVoiceStatus='';
    chatMessages.push({role:'bot',text:'Could not start voice input. Please try again or type your request.'});
    customer();
  }
}
function recommendedItems(){
  const selected=menu.filter(item=>cart[item.id]);
  if(!selected.length)return [];
  const complements={
    'Main Course':['Breads','Drinks','Desserts'],
    'Breads':['Main Course','Drinks'],
    'Starters':['Main Course','Drinks'],
    'South Indian':['Drinks','Starters'],
    'Desserts':['Drinks'],
    'Drinks':['Starters','Desserts']
  };
  const scores=new Map();
  menu.filter(item=>!cart[item.id]).forEach(candidate=>{
    let score=0;
    selected.forEach(chosen=>{
      if((complements[chosen.c]||[]).includes(candidate.c))score+=3;
      if(chosen.c===candidate.c)score+=1;
      orders.filter(order=>order.status==='paid'&&order.items.some(ordered=>ordered.id===chosen.id))
        .forEach(order=>{
          if(order.items.some(ordered=>ordered.id===candidate.id))score+=2;
        });
    });
    scores.set(candidate.id,score);
  });
  return [...menu].filter(item=>scores.has(item.id))
    .sort((a,b)=>scores.get(b.id)-scores.get(a.id)||a.n.localeCompare(b.n))
    .slice(0,3);
}
function chg(id,d){
  const removed=d<0&&(cart[id]||0)+d<=0;

  customer();
  if($('#modal').classList.contains('show'))openCart();
  if(window.mascot){
    if(removed)mascot.say('Oh, we’ll miss that one!','sad');
    else if(d>0)mascot.say(['Great choice!','Yum! Adding that now.'][Math.floor(Math.random()*2)],'happy');
  }
}
function cartItems(){return Object.entries(cart).map(([id,q])=>{const m=menu.find(x=>x.id==id);return m&&{id:m.id,n:m.n,p:m.p,q}}).filter(Boolean)}

function waitForVoices(){
  const synthesis=window.speechSynthesis;
  if(voicesReadyPromise)return voicesReadyPromise;
  voicesReadyPromise=new Promise(resolve=>{
    let finished=false;
    const finish=()=>{
      if(finished)return;
      finished=true;
      synthesis.removeEventListener('voiceschanged',onVoicesChanged);
      const voices=synthesis.getVoices();
      if(!voices.length)voicesReadyPromise=null;
      resolve(voices);
    };
    const onVoicesChanged=()=>finish();
    synthesis.addEventListener('voiceschanged',onVoicesChanged);
    setTimeout(finish,1200);
  });
  return voicesReadyPromise;
}
async function speak(text){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){
    toast('Voice is not available in this browser');
    return;
  }
  const synthesis=window.speechSynthesis;
  synthesis.cancel();
  const voices=await waitForVoices();
  const voice=voices.find(item=>item.lang.toLowerCase()==='en-in')
    ||voices.find(item=>['en-us','en-gb'].includes(item.lang.toLowerCase()))
    ||voices.find(item=>item.default)
    ||null;
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang=voice&&voice.lang.toLowerCase().startsWith('en')?voice.lang:'en-IN';
  utterance.rate=.9;
  utterance.pitch=1;
  if(voice)utterance.voice=voice;
  await new Promise(resolve=>{
    utterance.onend=resolve;
    utterance.onerror=event=>{
      if(event.error!=='canceled'&&event.error!=='interrupted'){
        toast('Voice announcement could not be played');
      }
      resolve();
    };
    try{
      synthesis.speak(utterance);
    }catch(error){
      console.warn('Could not start the voice announcement.',error);
      toast('Voice announcement could not be played');
      resolve();
    }
  });
}

function playDing(){
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return Promise.resolve();
  try{
    const context=new AudioContextClass();
    const oscillator=context.createOscillator();
    const gain=context.createGain();
    oscillator.type='sine';
    oscillator.frequency.setValueAtTime(880,context.currentTime);
    gain.gain.setValueAtTime(.0001,context.currentTime);
    gain.gain.exponentialRampToValueAtTime(.16,context.currentTime+.015);
    gain.gain.exponentialRampToValueAtTime(.0001,context.currentTime+.22);
    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.start();
    oscillator.stop(context.currentTime+.23);
    return new Promise(resolve=>{
      oscillator.onended=()=>{context.close();resolve()};
    });
  }catch(error){
    console.warn('Could not play the ready-order chime.',error);
    return Promise.resolve();
  }
}
async function announce(order){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){
    toast('Voice is not available in this browser');
    return;
  }
  if(!voiceEnabled){
    toast('Enable voice announcements first');
    return;
  }
  const currentAnnouncement=++announcementId;
  clearTimeout(announcementTimer);
  window.speechSynthesis.cancel();
  const orderDigits=String(order.id).split('').join(' ');
  const table=String(order.table).trim().slice(0,40);
  const message=`Order number ${orderDigits}, table ${table}. Your food is ready. Please collect it.`;
  await playDing();
  if(currentAnnouncement!==announcementId)return;
  await speak(message);
  if(currentAnnouncement!==announcementId)return;
  announcementTimer=setTimeout(async()=>{
    if(currentAnnouncement!==announcementId)return;
    await playDing();
    if(currentAnnouncement===announcementId)await speak(message);
  },2000);
}

function pMenu(){
  $('#pane').innerHTML=`<div class="card" style="margin-bottom:14px"><h3>Add item</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end">
  <div><label>Name</label><input id="mn"></div><div><label>Category</label><input id="mc" list="cl" placeholder="Starters"><datalist id="cl">${[...new Set(menu.map(m=>m.c))].map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div>
  <div><label>Price (₹)</label><input id="mp" type="number" min="0"></div><div><label>Food photo URL (optional)</label><input id="mi" type="url" placeholder="https://..."></div><div><label>Fallback emoji</label><input id="me" maxlength="2" placeholder="🍕"></div><button class="btn" onclick="addItem()">Add</button></div></div>
  <div class="grid">${menu.map(m=>`<div class="card row"><span>${foodImage(m)?`<img src="${esc(foodImage(m))}" alt="" style="width:54px;height:44px;object-fit:cover;border-radius:6px;vertical-align:middle">`:`${m.e||'🍽️'}`} <b>${esc(m.n)}</b><br><span class="muted">${esc(m.c)} · ${inr(m.p)}</span></span><button class="btn sm bad" onclick="delItem(${m.id})">Delete</button></div>`).join('')}</div>`;
}
function addItem(){
  const n=$('#mn').value.trim(),p=parseFloat($('#mp').value);if(!n||!(p>=0)){toast('Please enter a name and price');return}
  menu.push({id:Date.now(),n,c:$('#mc').value.trim()||'Other',p,e:$('#me').value.trim(),img:$('#mi').value.trim()});save('rb_menu',menu);toast('Item added');dash();
}
function delItem(id){menu=menu.filter(m=>m.id!==id);save('rb_menu',menu);dash()}
function pSet(){
  $('#pane').innerHTML=`<div class="card" style="max-width:460px"><h3>Settings</h3><label>Restaurant name</label><input id="sn" value="${esc(set.name)}">
  <label>GST % (total; split equally between CGST and SGST)</label><input id="sg" type="number" min="0" step="0.5" value="${set.gst}">
  <label>GSTIN (shown on the bill)</label><input id="si" value="${esc(set.gstin||'')}">
  <button class="btn" style="margin-top:14px" onclick="saveSet()">Save</button>
  <hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="btn bad sm" onclick="clearOrders()">Clear all orders</button></div>`;
}
function saveSet(){
  const g=parseFloat($('#sg').value);if(!(g>=0)||!$('#sp').value){toast('Please enter a valid GST rate and password');return}
  set={name:$('#sn').value.trim()||'Restaurant',gst:g,gstin:$('#si').value.trim()};save('rb_set',set);toast('Settings saved');
}
route();
    </script>
</body>

</html>
